{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Data Pendidikan{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=4">
    <link rel="stylesheet" href="{% static 'css/content-motion.css' %}">
    {% block extra_css %}{% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <header class="top-navigation">
            <a href="{% url 'home' %}" class="navbar-brand">
                <div class="navbar-logo">DP</div>
                <div class="navbar-brand-text">
                    <strong>Data Pendidikan</strong>
                    <span>Education Analytics</span>
                </div>
            </a>

            <nav class="navbar-menu">
                <a href="{% url 'home' %}" class="nav-item {% if active_page == 'home' %}active{% endif %}">
                    Dashboard
                </a>

                <a href="{% url 'dataset' %}" class="nav-item {% if active_page == 'dataset' %}active{% endif %}">
                    Eksplorasi Data
                </a>

                <a href="{% url 'prediction' %}" class="nav-item {% if active_page == 'prediction' %}active{% endif %}">Prediksi</a>

                <details class="nav-dropdown {% if active_page == 'model_info' or active_page == 'about' %}dropdown-active{% endif %}">
                    <summary>Lainnya <span class="dropdown-arrow">⌄</span></summary>
                    <div class="dropdown-content">
                        <a href="{% url 'model_info' %}" class="{% if active_page == 'model_info' %}active{% endif %}">Informasi Sistem Prediksi</a>
                        <a href="{% url 'about' %}" class="{% if active_page == 'about' %}active{% endif %}">Tentang Website</a>
                    </div>
                </details>
            </nav>
        </header>

        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    {% block extra_js %}{% endblock %}
    <script src="{% static 'js/content-motion.js' %}"></script>
</body>
</html>
